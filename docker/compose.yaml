services:
  vision-ws:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
    image: eurobot-2026-vision:latest
    container_name: vision-ws
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    command: ["/bin/bash"]
    working_dir: /home/vision/vision_ws
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=0
      # Changed to Cyclone to match your Dockerfile and RTAB-Map needs
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_WORKSPACE=/home/vision/vision_ws
      - QT_X11_NO_MITSHM=1  # Fixes some QT GUI rendering bugs in Docker
      - RCUTILS_LOGGING_USE_STDOUT=1  # rtabmap logging config recommended by document
      - RCUTILS_LOGGING_BUFFERED_STREAM=1
      - RCUTILS_COLORIZED_OUTPUT=1

    volumes:
      - /dev:/dev
      - ../:/home/vision/vision_ws
      # Required for GUI to show up on your host screen
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # IMPORTANT: Persist your map database!
      # RTAB-Map saves the map database (~/.ros/rtabmap.db) here by default.
      # If you don't map this, you lose your map when the container stops.
      - ./my_maps_data:/home/vision/.ros/  